name: Java 21 build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: depor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -d depor_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - run: for migration in supabase/migrations/*.sql; do psql -h localhost -U postgres -d depor_test -v ON_ERROR_STOP=1 -f "$migration"; done
      - run: for test in supabase/tests/rls*.sql; do psql -h localhost -U postgres -d depor_test -v ON_ERROR_STOP=1 -f "$test"; done
